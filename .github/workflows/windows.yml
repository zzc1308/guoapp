name: Build Windows packages

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-build]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Configure MinGW compiler
        shell: pwsh
        run: '"$env:RUNNER_TEMP\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Build and package Windows x64
        run: python scripts/build_windows.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
